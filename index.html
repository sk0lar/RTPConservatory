<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTP Conservatory - Music Education</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F46E5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3'/%3E%3C/svg%3E">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // ⬇️ PASTE YOUR FORMSPREE ID HERE ⬇️
        const FORMSPREE_ID = 'xgovgedw'; // Replace with your actual ID!
        
        // Google Sheets Apps Script Web App URL
        const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwVr0yM3KnWKCR7Ufv28GX6hzDHaeMQu79PVli-W699rKiRsbx6y6GTEyKOlEE3qHltLw/exec';

        function App() {
          const [page, setPage] = useState('home');
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [isContactSubmitting, setIsContactSubmitting] = useState(false);
          const [contactForm, setContactForm] = useState({
            name: '',
            email: '',
            phone: '',
            message: ''
          });
          const programsRef = useRef(null);
          const facultyRef = useRef(null);
          const contactRef = useRef(null);

          useEffect(() => {
            const path = window.location.pathname;
            if (path.includes('enroll')) {
              setPage('enroll');
            } else if (path.includes('thank-you')) {
              setPage('thankyou');
            } else {
              setPage('home');
            }
          }, []);

          const navigate = (newPage) => {
            setPage(newPage);
            if (newPage === 'home') {
              window.history.pushState({}, '', '/');
            } else if (newPage === 'enroll') {
              window.history.pushState({}, '', '/enroll');
            } else if (newPage === 'thankyou') {
              window.history.pushState({}, '', '/thank-you');
            }
            window.scrollTo(0, 0);
          };

          const scrollTo = (ref) => {
            ref.current?.scrollIntoView({ behavior: 'smooth' });
          };

          const handleFormSubmit = async (e) => {
            e.preventDefault();
            setIsSubmitting(true);

            const formData = new FormData(e.target);

            try {
              const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                method: 'POST',
                body: formData,
                headers: {
                  'Accept': 'application/json'
                }
              });

              if (response.ok) {
                navigate('thankyou');
              } else {
                alert('Something went wrong. Please try again or call us at (919) 579-8649');
              }
            } catch (error) {
              alert('Something went wrong. Please try again or call us at (919) 579-8649');
            } finally {
              setIsSubmitting(false);
            }
          };

          const handleContactSubmit = async () => {
            // Validate form
            if (!contactForm.name || !contactForm.email || !contactForm.phone) {
              alert('Please fill in all required fields (name, email, and phone)');
              return;
            }

            setIsContactSubmitting(true);

            try {
              const formData = new FormData();
              formData.append('name', contactForm.name);
              formData.append('email', contactForm.email);
              formData.append('phone', contactForm.phone);
              formData.append('message', contactForm.message);

              const response = await fetch(GOOGLE_SHEETS_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' // Google Apps Script requires no-cors mode
              });

              // With no-cors, we can't read the response, but if no error was thrown, it likely succeeded
              alert('Message sent successfully! We\'ll get back to you soon.');
              
              // Clear form
              setContactForm({
                name: '',
                email: '',
                phone: '',
                message: ''
              });
            } catch (error) {
              console.error('Error submitting form:', error);
              alert('Something went wrong. Please try again or call us at (919) 579-8649');
            } finally {
              setIsContactSubmitting(false);
            }
          };

          function Nav({ isSubPage }) {
            return (
              <nav className="fixed top-0 left-0 right-0 bg-slate-900 text-white px-6 py-4 z-50 shadow-lg">
                <div className="max-w-7xl mx-auto flex justify-between items-center">
                  <div className="flex items-center gap-2 text-xl font-semibold cursor-pointer" onClick={() => navigate('home')}>
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                    </svg>
                    RTP Conservatory
                  </div>
                  
                  {isSubPage ? (
                    <button onClick={() => navigate('home')} className="flex items-center gap-2 hover:text-blue-300 transition-colors">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                      </svg>
                      Back to Home
                    </button>
                  ) : (
                    <div className="flex items-center gap-8">
                      <button onClick={() => scrollTo(programsRef)} className="hover:text-blue-300 transition-colors">Programs</button>
                      <button onClick={() => scrollTo(facultyRef)} className="hover:text-blue-300 transition-colors">Faculty</button>
                      <button onClick={() => scrollTo(contactRef)} className="hover:text-blue-300 transition-colors">Contact</button>
                      <button onClick={() => navigate('enroll')} className="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg transition-colors">
                        Enroll Now
                      </button>
                    </div>
                  )}
                </div>
              </nav>
            );
          }

          if (page === 'home') {
            return (
              <div className="bg-slate-50">
                <Nav isSubPage={false} />
                
                <section className="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 text-white pt-32 pb-20 px-6">
                  <div className="max-w-7xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                    <div>
                      <h1 className="text-5xl font-bold mb-6 leading-tight">Discover Your Musical Potential</h1>
                      <p className="text-lg text-slate-300 mb-8 leading-relaxed">
                        RTP Conservatory offers affordable and personalized music education for students of all ages and skill levels.
                      </p>
                      <div className="flex gap-4">
                        <button onClick={() => navigate('enroll')} className="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg font-semibold transition-colors">
                          Schedule a Trial Lesson
                        </button>
                        <button onClick={() => scrollTo(programsRef)} className="bg-white text-slate-900 hover:bg-slate-100 px-8 py-3 rounded-lg font-semibold transition-colors">
                          Learn More
                        </button>
                      </div>
                    </div>
                    <div className="rounded-2xl overflow-hidden shadow-2xl">
                      <img src="./orchestra.jpg" alt="Orchestra" className="w-full h-full object-cover" />
                    </div>
                  </div>
                </section>

                <section ref={programsRef} className="py-20 px-6">
                  <div className="max-w-7xl mx-auto">
                    <h2 className="text-4xl font-bold text-center text-slate-900 mb-4">Our Programs</h2>
                    <p className="text-center text-slate-600 mb-12 text-lg">Comprehensive music education tailored to your goals</p>
                    
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                      {[
                        { 
                          title: 'Private Lessons', 
                          time: '30-60 min', 
                          desc: 'Personalized instruction for beginner and intermediate levels.',
                          hoverTitle: 'One-on-One Music Instruction',
                          hoverDesc: 'Work directly with expert instructors who tailor each lesson to your pace and goals. Perfect for focused learning and rapid progress.'
                        },
                        { 
                          title: 'Group Lessons', 
                          time: '30-60 min', 
                          desc: 'Learn with peers in small classes of 2-5 students.',
                          hoverTitle: 'Collaborative Learning Experience',
                          hoverDesc: 'Build musicianship alongside peers in intimate group settings. Develop ensemble skills while enjoying the social aspect of music education.'
                        },
                        { 
                          title: 'Music Theory', 
                          time: '60 min', 
                          desc: 'Deep dive into theory, composition, and arrangement.',
                          hoverTitle: 'Master the Language of Music',
                          hoverDesc: 'Understand the fundamentals that make music work. From reading notation to composing your own pieces, unlock the theory behind the melodies.'
                        },
                        { 
                          title: 'Performance Training', 
                          time: 'Flexible', 
                          desc: 'Prepare for recitals, auditions, and competitions.',
                          hoverTitle: 'Stage-Ready Preparation',
                          hoverDesc: 'Build confidence and polish your performance skills. Get expert coaching for auditions, recitals, competitions, and special events.'
                        }
                      ].map((prog, i) => (
                        <div key={i} className="bg-white rounded-xl p-6 shadow-md hover:shadow-xl transition-all duration-300 relative overflow-hidden group cursor-pointer">
                          {/* Default Content */}
                          <div className="transition-opacity duration-300 group-hover:opacity-0">
                            <div className="bg-blue-50 w-14 h-14 rounded-lg flex items-center justify-center text-blue-600 mb-4">
                              <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                              </svg>
                            </div>
                            <h3 className="text-xl font-bold text-slate-900 mb-2">{prog.title}</h3>
                            <p className="text-slate-600 text-sm mb-3">⏱️ {prog.time} lessons</p>
                            <p className="text-slate-600 leading-relaxed">{prog.desc}</p>
                          </div>
                          
                          {/* Hover Content */}
                          <div className="absolute inset-0 p-6 bg-gradient-to-br from-blue-600 to-blue-700 text-white flex flex-col justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <p className="text-xs uppercase tracking-wide mb-2 text-blue-100">Our Programs</p>
                            <h3 className="text-xl font-bold mb-3">{prog.hoverTitle}</h3>
                            <p className="text-sm leading-relaxed text-blue-50">{prog.hoverDesc}</p>
                            <div className="mt-4 text-xs text-blue-100">⏱️ {prog.time} lessons</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                <section ref={facultyRef} className="py-20 px-6 bg-white">
                  <div className="max-w-7xl mx-auto">
                    <h2 className="text-4xl font-bold text-center text-slate-900 mb-4">Meet Our Directors</h2>
                    <p className="text-center text-slate-600 mb-12 text-lg">Learn from experienced musicians and dedicated educators</p>
                    
                    <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                      {[
                        { name: 'Sujay Kolar', instrument: 'Violin', level: 'RCM Level 6, ERO', img: './sujay.jpg' },
                        { name: 'Pushpit Maggo', instrument: 'Cello', level: 'RCM Level 8, NCHO', img: './pushpit.jpg' }
                      ].map((faculty, i) => (
                        <div key={i} className="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-shadow">
                          <div className="aspect-square overflow-hidden">
                            <img src={faculty.img} alt={faculty.name} className="w-full h-full object-cover" />
                          </div>
                          <div className="p-6">
                            <h3 className="text-xl font-bold text-slate-900 mb-1">{faculty.name}</h3>
                            <p className="text-slate-600 mb-3">{faculty.instrument}</p>
                            <p className="text-slate-600 text-sm">🏆 {faculty.level}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                <section ref={contactRef} className="py-20 px-6 bg-slate-50">
                  <div className="max-w-7xl mx-auto grid md:grid-cols-2 gap-12">
                    <div>
                      <h2 className="text-4xl font-bold text-slate-900 mb-6">Get in Touch</h2>
                      <p className="text-slate-600 mb-8 text-lg">Ready to start your musical journey? Contact us today!</p>
                      
                      <div className="space-y-6">
                        <div className="flex items-center gap-4">
                          <div className="bg-blue-100 p-3 rounded-lg">📞</div>
                          <div>
                            <div className="text-sm text-slate-600">Phone</div>
                            <div className="font-semibold text-slate-900">(919) 579-8649</div>
                          </div>
                        </div>
                        <div className="flex items-center gap-4">
                          <div className="bg-blue-100 p-3 rounded-lg">✉️</div>
                          <div>
                            <div className="text-sm text-slate-600">Email</div>
                            <div className="font-semibold text-slate-900">info@rtpconservatory.com</div>
                          </div>
                        </div>
                      </div>
                    </div>
                    
                    <div className="bg-white rounded-2xl shadow-lg p-8">
                      <h3 className="text-2xl font-bold text-slate-900 mb-6">Request Information</h3>
                      <div className="space-y-4">
                        <input 
                          type="text" 
                          placeholder="Your name *" 
                          value={contactForm.name}
                          onChange={(e) => setContactForm({...contactForm, name: e.target.value})}
                          className="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" 
                        />
                        <input 
                          type="email" 
                          placeholder="your@email.com *" 
                          value={contactForm.email}
                          onChange={(e) => setContactForm({...contactForm, email: e.target.value})}
                          className="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" 
                        />
                        <input 
                          type="tel" 
                          placeholder="(555) 555-5555 *" 
                          value={contactForm.phone}
                          onChange={(e) => setContactForm({...contactForm, phone: e.target.value})}
                          className="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" 
                        />
                        <textarea 
                          placeholder="Your message..." 
                          rows="4" 
                          value={contactForm.message}
                          onChange={(e) => setContactForm({...contactForm, message: e.target.value})}
                          className="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 resize-none" 
                        />
                        <button 
                          onClick={handleContactSubmit} 
                          disabled={isContactSubmitting}
                          className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-3 rounded-lg transition-colors"
                        >
                          {isContactSubmitting ? 'Sending...' : 'Send Message'}
                        </button>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            );
          }

          if (page === 'enroll') {
            return (
              <div className="bg-slate-50 min-h-screen">
                <Nav isSubPage={true} />
                
                <section className="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 text-white pt-32 pb-20 px-6">
                  <div className="max-w-4xl mx-auto text-center">
                    <h1 className="text-5xl font-bold mb-6">Schedule Your Trial Lesson</h1>
                    <p className="text-lg text-slate-300">Fill out the form below and we'll contact you within 24 hours.</p>
                  </div>
                </section>

                <section className="py-16 px-6">
                  <div className="max-w-6xl mx-auto grid md:grid-cols-3 gap-8">
                    {[
                      { icon: '📅', title: 'Flexible Scheduling', desc: 'Choose a time that works for you' },
                      { icon: '👨‍🏫', title: 'Expert Instructors', desc: 'Learn from passionate teachers' },
                      { icon: '🎵', title: 'All Levels Welcome', desc: 'From beginners to intermediate' }
                    ].map((feat, i) => (
                      <div key={i} className="bg-white rounded-xl p-6 shadow-md text-center">
                        <div className="text-5xl mb-4">{feat.icon}</div>
                        <h3 className="text-xl font-bold text-slate-900 mb-2">{feat.title}</h3>
                        <p className="text-slate-600">{feat.desc}</p>
                      </div>
                    ))}
                  </div>
                </section>

                <section className="py-16 px-6 pb-32">
                  <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8 md:p-12">
                    <h2 className="text-3xl font-bold text-slate-900 mb-2">Enrollment Form</h2>
                    <p className="text-slate-600 mb-8">We'll get back to you within 24 hours.</p>
                    
                    <form onSubmit={handleFormSubmit} className="space-y-8">
                      <div>
                        <h3 className="text-xl font-semibold text-slate-900 mb-4">Student Information</h3>
                        <div className="grid md:grid-cols-2 gap-6">
                          <input type="text" name="studentName" required placeholder="Student Name *" className="px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                          <input type="text" name="parentName" placeholder="Parent/Guardian Name" className="px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                      </div>

                      <div>
                        <h3 className="text-xl font-semibold text-slate-900 mb-4">Contact Information</h3>
                        <div className="grid md:grid-cols-2 gap-6">
                          <input type="email" name="email" required placeholder="Email Address *" className="px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                          <input type="tel" name="phone" required placeholder="Phone Number *" className="px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                      </div>

                      <div>
                        <h3 className="text-xl font-semibold text-slate-900 mb-4">Musical Background</h3>
                        <div className="space-y-6">
                          <select name="instrument" required className="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Instrument *</option>
                            <option>Piano</option>
                            <option>Violin</option>
                            <option>Cello</option>
                            <option>Guitar</option>
                            <option>Voice</option>
                          </select>
                          <select name="experience" className="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Experience Level</option>
                            <option>Beginner (No experience)</option>
                            <option>Some experience (1-2 years)</option>
                            <option>Intermediate (3+ years)</option>
                          </select>
                          <textarea name="message" placeholder="Additional comments or questions..." rows="4" className="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 resize-none" />
                        </div>
                      </div>

                      <button type="submit" disabled={isSubmitting} className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-4 rounded-lg transition-colors text-lg">
                        {isSubmitting ? 'Submitting...' : 'Submit Enrollment Request'}
                      </button>
                    </form>
                  </div>
                </section>
              </div>
            );
          }

          if (page === 'thankyou') {
            return (
              <div className="bg-gradient-to-br from-slate-900 via-blue-900 to-purple-900 min-h-screen">
                <Nav isSubPage={true} />
                
                <section className="pt-32 pb-20 px-6">
                  <div className="max-w-4xl mx-auto text-center">
                    <div className="bg-white rounded-3xl shadow-2xl p-12 md:p-16 relative overflow-hidden">
                      <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
                      
                      <div className="inline-flex items-center justify-center w-24 h-24 bg-green-100 rounded-full mb-6">
                        <svg className="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                      
                      <h1 className="text-5xl font-bold text-slate-900 mb-4">Thank You!</h1>
                      <p className="text-xl text-slate-600 mb-8">Your enrollment request has been received successfully.</p>

                      <div className="bg-blue-50 rounded-2xl p-8 mb-8">
                        <h2 className="text-2xl font-bold text-slate-900 mb-6">What Happens Next?</h2>
                        
                        <div className="space-y-6 text-left">
                          {[
                            { num: '1', title: 'Review Your Information', desc: 'Our team will review your enrollment form and musical background.' },
                            { num: '2', title: "We'll Contact You", desc: 'Expect a call or email from us within 24 hours to discuss scheduling.' },
                            { num: '3', title: 'Schedule Your Free Trial', desc: "We'll set up your complimentary trial lesson at a time that works for you." },
                            { num: '4', title: 'Start Your Musical Journey', desc: 'Meet your instructor and begin learning!' }
                          ].map((step, i) => (
                            <div key={i} className="flex items-start gap-4">
                              <div className="flex-shrink-0 w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">
                                {step.num}
                              </div>
                              <div>
                                <h3 className="font-semibold text-slate-900 mb-1">{step.title}</h3>
                                <p className="text-slate-600">{step.desc}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="border-t border-slate-200 pt-8 mb-8">
                        <h3 className="text-lg font-semibold text-slate-900 mb-4">Questions in the meantime?</h3>
                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                          <a href="tel:9195798649" className="text-blue-600 hover:text-blue-700 font-medium">📞 (919) 579-8649</a>
                          <span className="hidden sm:inline text-slate-400">•</span>
                          <a href="mailto:info@rtpconservatory.com" className="text-blue-600 hover:text-blue-700 font-medium">✉️ info@rtpconservatory.com</a>
                        </div>
                      </div>

                      <button onClick={() => navigate('home')} className="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-semibold px-8 py-3 rounded-lg transition-all">
                        Return to Home
                      </button>
                    </div>

                    <div className="mt-12 grid md:grid-cols-3 gap-6 text-white">
                      {[
                        { emoji: '🎵', title: 'Affordable Pricing', desc: 'Quality music education that fits your budget' },
                        { emoji: '🎓', title: 'Expert Teachers', desc: 'Learn from passionate, experienced musicians' },
                        { emoji: '⭐', title: 'Flexible Schedule', desc: 'Lessons that work around your busy life' }
                      ].map((card, i) => (
                        <div key={i} className="bg-white/10 backdrop-blur-sm rounded-xl p-6">
                          <div className="text-4xl mb-2">{card.emoji}</div>
                          <h3 className="font-semibold mb-2">{card.title}</h3>
                          <p className="text-sm text-slate-200">{card.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>
              </div>
            );
          }
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

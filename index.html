<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTP Conservatory - Music Education</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef } = React;

        const RTConservatory = () => {
          const [currentPage, setCurrentPage] = useState('home');
          
          const programsRef = useRef(null);
          const facultyRef = useRef(null);
          const contactRef = useRef(null);

          const scrollToSection = (ref) => {
            ref.current?.scrollIntoView({ behavior: 'smooth' });
          };

          const Navigation = ({ isEnrollPage = false }) => (
            <nav className="fixed top-0 left-0 right-0 bg-slate-900 text-white px-6 py-4 z-50 shadow-lg">
              <div className="max-w-7xl mx-auto flex justify-between items-center">
                <div className="flex items-center gap-2 text-xl font-semibold cursor-pointer" onClick={() => setCurrentPage('home')}>
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                  </svg>
                  RTP Conservatory
                </div>
                
                {isEnrollPage ? (
                  <button 
                    onClick={() => setCurrentPage('home')}
                    className="flex items-center gap-2 text-white hover:text-blue-300 transition-colors"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to Home
                  </button>
                ) : (
                  <div className="flex items-center gap-8">
                    <button onClick={() => scrollToSection(programsRef)} className="hover:text-blue-300 transition-colors">
                      Programs
                    </button>
                    <button onClick={() => scrollToSection(facultyRef)} className="hover:text-blue-300 transition-colors">
                      Faculty
                    </button>
                    <button onClick={() => scrollToSection(contactRef)} className="hover:text-blue-300 transition-colors">
                      Contact
                    </button>
                    <button 
                      onClick={() => setCurrentPage('enroll')}
                      className="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg transition-colors"
                    >
                      Enroll Now
                    </button>
                  </div>
                )}
              </div>
            </nav>
          );

          const ProgramCard = ({ icon, title, duration, description }) => (
            <div className="bg-white rounded-xl p-6 shadow-md hover:shadow-xl transition-shadow">
              <div className="bg-blue-50 w-14 h-14 rounded-lg flex items-center justify-center text-blue-600 mb-4">
                {icon}
              </div>
              <h3 className="text-xl font-bold text-slate-900 mb-2">{title}</h3>
              <div className="flex items-center gap-2 text-slate-600 text-sm mb-3">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span>{duration}</span>
              </div>
              <p className="text-slate-600 leading-relaxed">{description}</p>
            </div>
          );

          const FacultyCard = ({ name, instrument, level, image }) => (
            <div className="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-shadow">
              <div className="aspect-square overflow-hidden">
                <img 
                  src={image} 
                  alt={name}
                  className="w-full h-full object-cover"
                />
              </div>
              <div className="p-6">
                <h3 className="text-xl font-bold text-slate-900 mb-1">{name}</h3>
                <p className="text-slate-600 mb-3">{instrument}</p>
                <div className="flex items-center gap-2 text-slate-600 text-sm">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                  </svg>
                  <span>{level}</span>
                </div>
              </div>
            </div>
          );

          const FeatureCard = ({ icon, title, description }) => (
            <div className="bg-white rounded-xl p-6 shadow-md text-center">
              <div className="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center text-blue-600 mx-auto mb-4">
                {icon}
              </div>
              <h3 className="text-xl font-bold text-slate-900 mb-2">{title}</h3>
              <p className="text-slate-600">{description}</p>
            </div>
          );

          const HomePage = () => (
            <div className="bg-slate-50">
              <Navigation />
              
              <section className="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 text-white pt-32 pb-20 px-6">
                <div className="max-w-7xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                  <div>
                    <h1 className="text-5xl font-bold mb-6 leading-tight">
                      Discover Your Musical Potential
                    </h1>
                    <p className="text-lg text-slate-300 mb-8 leading-relaxed">
                      RTP Conservatory offers affordable and personalized music education for students of all ages and skill levels. Join our community of passionate musicians and experienced faculty.
                    </p>
                    <div className="flex gap-4">
                      <button 
                        onClick={() => setCurrentPage('enroll')}
                        className="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg font-semibold transition-colors"
                      >
                        Schedule a Trial Lesson
                      </button>
                      <button 
                        onClick={() => scrollToSection(programsRef)}
                        className="bg-white text-slate-900 hover:bg-slate-100 px-8 py-3 rounded-lg font-semibold transition-colors"
                      >
                        Learn More
                      </button>
                    </div>
                  </div>
                  <div className="rounded-2xl overflow-hidden shadow-2xl">
                    <img 
                      src="./images/orchestra.jpg" 
                      alt="Orchestra"
                      className="w-full h-full object-cover"
                    />
                  </div>
                </div>
              </section>

              <section ref={programsRef} className="py-20 px-6">
                <div className="max-w-7xl mx-auto">
                  <h2 className="text-4xl font-bold text-center text-slate-900 mb-4">Our Programs</h2>
                  <p className="text-center text-slate-600 mb-12 text-lg">
                    Comprehensive music education tailored to your goals and skill level
                  </p>
                  
                  <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <ProgramCard
                      icon={<svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>}
                      title="Private Lessons"
                      duration="30-60 min lessons"
                      description="Classical and contemporary personalized music instruction for beginner and intermediate levels."
                    />
                    <ProgramCard
                      icon={<svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>}
                      title="Group Lessons"
                      duration="30-60 min lessons"
                      description="Classical and contemporary music instruction for beginner and intermediate levels. Class size of 2-5."
                    />
                    <ProgramCard
                      icon={<svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>}
                      title="Music Theory"
                      duration="60 min lessons"
                      description="Deep dive into music theory, composition, and arrangement to complement your instrumental studies."
                    />
                    <ProgramCard
                      icon={<svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>}
                      title="Performance Training"
                      duration="Flexible schedules"
                      description="Prepare for recitals, auditions, and competitions with our professional performance coaching."
                    />
                  </div>
                </div>
              </section>

              <section ref={facultyRef} className="py-20 px-6 bg-white">
                <div className="max-w-7xl mx-auto">
                  <h2 className="text-4xl font-bold text-center text-slate-900 mb-4">Meet Our Faculty</h2>
                  <p className="text-center text-slate-600 mb-12 text-lg">
                    Learn from experienced musicians and dedicated educators
                  </p>
                  
                  <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                    <FacultyCard
                      name="Sujay Kolar"
                      instrument="Violin"
                      level="RCM Level 6"
                      image="./images/sujay.jpg"
                    />
                    <FacultyCard
                      name="Pushpit Maggo"
                      instrument="Cello"
                      level="RCM Level 8"
                      image="./images/pushpit.jpg"
                    />
                  </div>
                </div>
              </section>

              <section ref={contactRef} className="py-20 px-6 bg-slate-50">
                <div className="max-w-7xl mx-auto grid md:grid-cols-2 gap-12">
                  <div>
                    <h2 className="text-4xl font-bold text-slate-900 mb-6">Get in Touch</h2>
                    <p className="text-slate-600 mb-8 text-lg">
                      Ready to start your musical journey? Contact us today to schedule a trial lesson or learn more about our programs.
                    </p>
                    
                    <div className="space-y-6">
                      <div className="flex items-center gap-4">
                        <div className="bg-blue-100 p-3 rounded-lg">
                          <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                          </svg>
                        </div>
                        <div>
                          <div className="text-sm text-slate-600">Phone</div>
                          <div className="font-semibold text-slate-900">(919) 579-8649</div>
                        </div>
                      </div>
                      
                      <div className="flex items-center gap-4">
                        <div className="bg-blue-100 p-3 rounded-lg">
                          <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                          </svg>
                        </div>
                        <div>
                          <div className="text-sm text-slate-600">Email</div>
                          <div className="font-semibold text-slate-900">info@rtpconservatory.com</div>
                        </div>
                      </div>
                    </div>
                  </div>
                  
                  <div className="bg-white rounded-2xl shadow-lg p-8">
                    <h3 className="text-2xl font-bold text-slate-900 mb-6">Request Information</h3>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">Full Name</label>
                        <input 
                          type="text" 
                          placeholder="Your name"
                          className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">Email</label>
                        <input 
                          type="email" 
                          placeholder="your@email.com"
                          className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">Phone</label>
                        <input 
                          type="tel" 
                          placeholder="(555) 555-5555"
                          className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">Message</label>
                        <textarea 
                          placeholder="Tell us about your musical goals..."
                          rows="4"
                          className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none"
                        />
                      </div>
                      <button 
                        onClick={(e) => {
                          e.preventDefault();
                          alert('Thank you! We will contact you soon.');
                        }}
                        className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors"
                      >
                        Send Message
                      </button>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          );

          const EnrollPage = () => (
            <div className="bg-slate-50 min-h-screen">
              <Navigation isEnrollPage={true} />
              
              <section className="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 text-white pt-32 pb-20 px-6">
                <div className="max-w-4xl mx-auto text-center">
                  <h1 className="text-5xl font-bold mb-6">Schedule Your Trial Lesson</h1>
                  <p className="text-lg text-slate-300">
                    Take the first step towards musical excellence. Fill out the form below and we'll contact you to schedule your free trial lesson.
                  </p>
                </div>
              </section>

              <section className="py-16 px-6">
                <div className="max-w-6xl mx-auto grid md:grid-cols-3 gap-8">
                  <FeatureCard
                    icon={<svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>}
                    title="Flexible Scheduling"
                    description="Choose a time that works best for your schedule"
                  />
                  <FeatureCard
                    icon={<svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>}
                    title="Expert Instructors"
                    description="Learn from experienced and passionate teachers"
                  />
                  <FeatureCard
                    icon={<svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>}
                    title="All Levels Welcome"
                    description="From beginners to intermediate students"
                  />
                </div>
              </section>

              <section className="py-16 px-6 pb-32">
                <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8 md:p-12">
                  <h2 className="text-3xl font-bold text-slate-900 mb-2">Enrollment Form</h2>
                  <p className="text-slate-600 mb-8">Please provide your information and we'll get back to you within 24 hours.</p>
                  
                  <div className="space-y-8">
                    <div>
                      <h3 className="text-xl font-semibold text-slate-900 mb-4">Student Information</h3>
                      <div className="grid md:grid-cols-2 gap-6">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">
                            Student Name <span className="text-red-500">*</span>
                          </label>
                          <input 
                            type="text" 
                            placeholder="Full name"
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">Parent/Guardian Name</label>
                          <input 
                            type="text" 
                            placeholder="If student is under 18"
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                          />
                        </div>
                      </div>
                    </div>

                    <div>
                      <h3 className="text-xl font-semibold text-slate-900 mb-4">Contact Information</h3>
                      <div className="grid md:grid-cols-2 gap-6">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">
                            Email Address <span className="text-red-500">*</span>
                          </label>
                          <input 
                            type="email" 
                            placeholder="your@email.com"
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">
                            Phone Number <span className="text-red-500">*</span>
                          </label>
                          <input 
                            type="tel" 
                            placeholder="(555) 555-5555"
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                          />
                        </div>
                      </div>
                    </div>

                    <div>
                      <h3 className="text-xl font-semibold text-slate-900 mb-4">Musical Background</h3>
                      <div className="space-y-6">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">
                            Instrument of Interest <span className="text-red-500">*</span>
                          </label>
                          <select className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                            <option value="">Select an instrument</option>
                            <option value="piano">Piano</option>
                            <option value="violin">Violin</option>
                            <option value="cello">Cello</option>
                            <option value="guitar">Guitar</option>
                            <option value="voice">Voice</option>
                            <option value="other">Other</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">Experience Level</label>
                          <select className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                            <option value="">Select experience level</option>
                            <option value="beginner">Beginner (No experience)</option>
                            <option value="some">Some experience (1-2 years)</option>
                            <option value="intermediate">Intermediate (3+ years)</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">Additional Comments</label>
                          <textarea 
                            placeholder="Tell us about your musical goals, preferred schedule, or any questions..."
                            rows="4"
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none"
                          />
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={(e) => {
                        e.preventDefault();
                        alert('Thank you for your enrollment request! We will contact you within 24 hours.');
                      }}
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-lg transition-colors text-lg"
                    >
                      Submit Enrollment Request
                    </button>
                  </div>
                </div>
              </section>
            </div>
          );

          return currentPage === 'home' ? <HomePage /> : <EnrollPage />;
        };

        ReactDOM.render(<RTConservatory />, document.getElementById('root'));
    </script>
</body>
</html>
